# ghop.conf - configuracao comum aos servicos do GHop.
#
# Instalado em /etc/ghop/ghop.conf. Os instaladores nao sobrescrevem este
# arquivo se ele ja existir na maquina: edite ali e reinstale (ou reinicie
# o servico) para valer.
#
# Formato: CHAVE=valor, uma por linha. Nao e um script -- os instaladores
# leem as chaves, nao executam o arquivo.

# Usuario e grupo sob os quais os servicos do GHop rodam.
#
# Hoje root, e por necessidade: o coletor abre captura de pacotes e o agente
# vai precisar agir na maquina (nftables, processos). Quando o agente for
# dividido entre a parte que fala na rede e a parte que executa, so a segunda
# continua precisando de privilegio -- e este arquivo e o unico lugar onde
# isso muda.
#
# Ao trocar por um usuario comum, lembrar que a captura passa a exigir
# CAP_NET_RAW e CAP_NET_ADMIN no servico.
USER=root
GROUP=root
